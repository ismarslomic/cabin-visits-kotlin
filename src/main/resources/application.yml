# See https://ktor.io/docs/server-configuration-file.html#config-basic and
# https://ktor.io/docs/server-configuration-file.html#predefined-properties

### KTOR ###
ktor:
  # Deployment
  deployment:
    port: 8079
    host: 0.0.0.0

folders:
  data: ${DATA_FOLDER:-/data}

google-calendar:
  credentials-file-path: ${GOOGLE_CREDENTIALS_FILE_PATH}
  calendar-id: ${GOOGLE_CALENDAR_ID}

calendar-outbox:
  event-title: ${CALENDAR_EVENT_TITLE:-Hyttebesøk}
  batch-size: ${CALENDAR_OUTBOX_BATCH_SIZE:-50}
  drain-interval-seconds: ${CALENDAR_OUTBOX_DRAIN_INTERVAL_SECONDS:-30}
  backoff-start-seconds: ${CALENDAR_OUTBOX_BACKOFF_START_SECONDS:-30}
  backoff-factor: ${CALENDAR_OUTBOX_BACKOFF_FACTOR:-2.0}
  backoff-cap-seconds: ${CALENDAR_OUTBOX_BACKOFF_CAP_SECONDS:-3600}
  stuck-threshold-minutes: ${CALENDAR_OUTBOX_STUCK_THRESHOLD_MINUTES:-60}

database:
  file-path: ${folders.data}/app.db

statistics:
  data-start-date: ${STATISTICS_DATA_START_DATE}

influx-db:
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG}
  bucket: ${INFLUXDB_BUCKET}
  check-in:
    measurement: ${INFLUXDB_CHECK_IN_MEASUREMENT}
    range-start: ${INFLUXDB_CHECK_IN_RANGE_START}
    range-stop: ${INFLUXDB_CHECK_IN_RANGE_STOP:-}
    sync-enabled: ${INFLUXDB_CHECK_IN_SYNC_ENABLED:-true}
    sync-frequency-minutes: ${INFLUXDB_CHECK_IN_SYNC_FREQ_MINUTES:-10}

vehicle-trip:
  file-path: ${VEHICLE_TRIP_FILE_PATH}
  sync-enabled: ${VEHICLE_TRIP_SYNC_ENABLED:-true}
  sync-from-date: ${VEHICLE_TRIP_SYNC_FROM_DATE}

# The JLR Data Hub (vehicle trips). The client id and the private key are the Data Access Credential.
jlr:
  client-id: ${JLR_CLIENT_ID}
  vin: ${JLR_VIN}
  private-key: ${JLR_PRIVATE_KEY}
  fetch-interval-hours: ${JLR_FETCH_INTERVAL_HOURS:-12}

# The home and the cabin need no place lookup: a point within radius-meters of them is that place. Positions are
# personal data, so there is no default for them.
places:
  home:
    latitude: ${HOME_LATITUDE}
    longitude: ${HOME_LONGITUDE}
    address: ${HOME_ADDRESS}
    radius-meters: ${HOME_RADIUS_METERS:-200}
  cabin:
    latitude: ${CABIN_LATITUDE}
    longitude: ${CABIN_LONGITUDE}
    address: ${CABIN_ADDRESS}
    radius-meters: ${CABIN_RADIUS_METERS:-200}

cloudflare-access:
  team-domain: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
  audience: ${CLOUDFLARE_ACCESS_AUD:-}

api-key:
  keys: ${API_KEYS:-}

bootstrap-admin:
  email: ${BOOTSTRAP_ADMIN_EMAIL:-}
  first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
  last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
  birth-year: ${BOOTSTRAP_ADMIN_BIRTH_YEAR:-}
  gender: ${BOOTSTRAP_ADMIN_GENDER:-}
